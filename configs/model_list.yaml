# Local models are identified only by their Hugging Face repository ID.
models:

  # phi-1.5

  phi_1_5:
    model: "microsoft/phi-1_5"

  # phi-2

  phi_2:
    model: "microsoft/phi-2"

  # phi-3

  phi_3_medium_128k_inst:
    model: "microsoft/Phi-3-medium-128k-instruct"

  # phi-4

  phi_4:
    model: "microsoft/phi-4"

  # qwen-2.5

  qwen_2_5_1_5b_inst:
    model: "Qwen/Qwen2.5-1.5B-Instruct"

  qwen_2_5_3b_inst:
    model: "Qwen/Qwen2.5-3B-Instruct"

  qwen_2_5_7b_inst:
    model: "Qwen/Qwen2.5-7B-Instruct"

  qwen_2_5_14b_inst:
    model: "Qwen/Qwen2.5-14B-Instruct"

  # gemma 3

  gemma_3_1b_it:
    model: "google/gemma-3-1b-it"

  gemma_3_4b_it:
    model: "google/gemma-3-4b-it"

  gemma_3_12b_it:
    model: "google/gemma-3-12b-it"

  gemma_3_27b_it:
    model: "google/gemma-3-27b-it"

  # llama-3.1

  llama3_1_8b_inst:
    model: "meta-llama/Llama-3.1-8B-Instruct"

  # llama3.2

  llama3_2_1b_inst:
    model: "meta-llama/Llama-3.2-1B-Instruct"

  llama3_2_3b_inst:
    model: "meta-llama/Llama-3.2-3B-Instruct"

  # API models

  gpt-4.1-mini:
    backend: api
    model: gpt-4.1-mini
    generation:
      max_tokens: 1000
      temperature: 0.0
  
  gpt-4.1:
    backend: api
    model: gpt-4.1
    generation:
      max_tokens: 1000
      temperature: 0.0
